name: Refresh website release notes

on:
  release:
    types: [published, edited, deleted, unpublished]
  workflow_dispatch:
  # Old release tags may not contain this workflow. Refresh from the default branch too.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
