name: Release assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to receive the assets
        required: true
        type: string
      partner_center_mode:
        description: Partner Center action for a manual workflow run
        required: true
        default: skip
        type: choice
        options:
          - skip
          - validate
          - publish

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
  WXT_ONEDROP_ENTRA_CLIENT_ID: ${{ secrets.ONEDROP_ENTRA_CLIENT_ID }}

jobs:
  edge:
    name: Edge release packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore stable extension keys
        env:
          DESKTOP_EDGE_PUBLIC_KEY: ${{ secrets.DESKTOP_EDGE_PUBLIC_KEY }}
          MOBILE_EDGE_CRX_KEY: ${{ secrets.MOBILE_EDGE_CRX_KEY || secrets.ANDROID_EDGE_CRX_KEY }}
        run: |
          test -n "$WXT_ONEDROP_ENTRA_CLIENT_ID"
          test -n "$DESKTOP_EDGE_PUBLIC_KEY"
          test -n "$MOBILE_EDGE_CRX_KEY"
          mkdir -p .keys
          printf '%s' "$DESKTOP_EDGE_PUBLIC_KEY" > .keys/desktop-dev-public.key
          printf '%s' "$MOBILE_EDGE_CRX_KEY" | base64 --decode > .keys/mobile-dev.pem
          chmod 600 .keys/desktop-dev-public.key .keys/mobile-dev.pem

      - name: Build desktop Edge ZIP
        run: npm run zip

      - name: Build Edge Mobile CRX
        env:
          ONEDROP_CHROMIUM_BINARY: /usr/bin/google-chrome
        run: npm run pack:mobile-edge

      - name: Stage Edge release assets
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-assets
          cp ".output/OneDrop-${VERSION}-desktop-edge.zip" "release-assets/OneDrop-${VERSION}-desktop-edge.zip"
          cp .output/edge-mobile/edge-mv3.crx "release-assets/OneDrop-${VERSION}-mobile-edge.crx"

      - name: Upload Edge packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

  ios:
    name: Native iOS LiveContainer package
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned LiveContainer IPA
        run: |
          test -n "$WXT_ONEDROP_ENTRA_CLIENT_ID"
          npm exec -- wxt prepare
          npm run pack:ios

      - name: Stage iOS release asset
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-assets
          cp .output/ios-native/onedrop-ios-livecontainer.ipa "release-assets/OneDrop-${VERSION}.ipa"

      - name: Upload iOS package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

  partner-center:
    name: Partner Center submission
    if: github.event_name == 'release' || inputs.partner_center_mode != 'skip'
    needs:
      - edge
      - ios
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: release-source

      - name: Checkout current publishing automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: automation-source

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: release-source/package-lock.json

      - name: Install release dependencies
        working-directory: release-source
        run: npm ci

      - name: Build Partner Center ZIP
        working-directory: release-source
        run: |
          test -n "$WXT_ONEDROP_ENTRA_CLIENT_ID"
          npm run zip:store

      - name: Prepare Partner Center release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-source/.output/partner-center
          gh release view "$RELEASE_TAG" --json body --jq .body > release-source/.output/partner-center/release-body.md

      - name: Upload and submit Partner Center package
        env:
          EDGE_ADDONS_PRODUCT_ID: ${{ secrets.EDGE_ADDONS_PRODUCT_ID }}
          EDGE_ADDONS_API_KEY: ${{ secrets.EDGE_ADDONS_API_KEY }}
          EDGE_ADDONS_CLIENT_ID: ${{ secrets.EDGE_ADDONS_CLIENT_ID }}
          EDGE_ADDONS_CERTIFICATION_NOTES: ${{ secrets.EDGE_ADDONS_CERTIFICATION_NOTES }}
          EDGE_ADDONS_RELEASE_BODY_PATH: release-source/.output/partner-center/release-body.md
          EDGE_ADDONS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.partner_center_mode == 'validate' && '1' || '0' }}
        run: |
          VERSION=$(node -p "require('./release-source/package.json').version")
          EDGE_ADDONS_PACKAGE_PATH="release-source/.output/OneDrop-${VERSION}-edge-store.zip" node automation-source/scripts/publish-edge-addons.mjs
