name: Release assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to build
        required: true
        type: string
      partner_center_mode:
        description: Partner Center action for a manual workflow run
        required: true
        default: skip
        type: choice
        options:
          - skip
          - validate
          - publish

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
  WXT_ONEDROP_ENTRA_CLIENT_ID: ${{ secrets.ONEDROP_ENTRA_CLIENT_ID }}

jobs:
  edge:
    if: >-
      (github.event_name == 'release' || inputs.partner_center_mode == 'skip') &&
      !startsWith(github.event.release.tag_name || inputs.release_tag, 'ios-beta-v')
    name: Edge release packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore stable extension keys
        env:
          DESKTOP_EDGE_PUBLIC_KEY: ${{ secrets.DESKTOP_EDGE_PUBLIC_KEY }}
          MOBILE_EDGE_CRX_KEY: ${{ secrets.MOBILE_EDGE_CRX_KEY || secrets.ANDROID_EDGE_CRX_KEY }}
        run: |
          test -n "$WXT_ONEDROP_ENTRA_CLIENT_ID"
          test -n "$DESKTOP_EDGE_PUBLIC_KEY"
          test -n "$MOBILE_EDGE_CRX_KEY"
          mkdir -p .keys
          printf '%s' "$DESKTOP_EDGE_PUBLIC_KEY" > .keys/desktop-dev-public.key
          printf '%s' "$MOBILE_EDGE_CRX_KEY" | base64 --decode > .keys/mobile-dev.pem
          chmod 600 .keys/desktop-dev-public.key .keys/mobile-dev.pem

      - name: Build desktop Edge ZIP
        run: npm run zip

      - name: Build Edge Mobile CRX
        env:
          ONEDROP_CHROMIUM_BINARY: /usr/bin/google-chrome
        run: npm run pack:mobile-edge

      - name: Stage Edge release assets
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-assets
          cp ".output/OneDrop-${VERSION}-desktop-edge.zip" "release-assets/OneDrop-${VERSION}-desktop-edge.zip"
          cp .output/edge-mobile/edge-mv3.crx "release-assets/OneDrop-${VERSION}-mobile-edge.crx"

      - name: Upload Edge packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

  android:
    if: >-
      (github.event_name == 'release' || inputs.partner_center_mode == 'skip') &&
      !startsWith(github.event.release.tag_name || inputs.release_tag, 'ios-beta-v')
    name: Native Android release package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build signed Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$WXT_ONEDROP_ENTRA_CLIENT_ID"
          test -n "$ANDROID_KEYSTORE_BASE64"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/onedrop-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          npm run pack:android -- --release
          VERSION=$(node -p "require('./package.json').version")
          test "${RELEASE_TAG#v}" = "$VERSION"
      - name: Upload Android package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "$RELEASE_TAG" ".output/android/OneDrop-${VERSION}-android.apk" --clobber

  ios:
    if: github.event_name == 'release' || inputs.partner_center_mode == 'skip'
    name: Native iOS LiveContainer package
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned LiveContainer IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$WXT_ONEDROP_ENTRA_CLIENT_ID"
          npm exec -- wxt prepare
          if [[ "$RELEASE_TAG" == ios-beta-v* ]]; then
            gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '.isPrerelease and (.isDraft | not)' | grep -qx true
            npm run pack:ios -- --beta "${RELEASE_TAG#ios-beta-v}"
          else
            npm run pack:ios
          fi

      - name: Stage iOS release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          if [[ "$RELEASE_TAG" == ios-beta-v* ]]; then
            VERSION=${RELEASE_TAG#ios-beta-v}
            IPA=".output/ios-beta/OneDrop-Beta-$VERSION.ipa"
            unzip -p "$IPA" Payload/OneDrop.app/Info.plist > "$RUNNER_TEMP/OneDrop.plist"
            test "$(plutil -extract CFBundleIdentifier raw "$RUNNER_TEMP/OneDrop.plist")" = com.sycamore.onedrop.beta
            test "$(plutil -extract CFBundleDisplayName raw "$RUNNER_TEMP/OneDrop.plist")" = "OneDrop Beta"
            test "$(plutil -extract CFBundleShortVersionString raw "$RUNNER_TEMP/OneDrop.plist")" = "$VERSION"
            test "$(plutil -extract CFBundleVersion raw "$RUNNER_TEMP/OneDrop.plist")" = "$VERSION"
            cp "$IPA" release-assets/
          else
            VERSION=$(node -p "require('./package.json').version")
            IPA=.output/ios-native/onedrop-ios-livecontainer.ipa
            stable=$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease) | not')
            if [[ "$stable" == true ]]; then
              unzip -p "$IPA" Payload/OneDrop.app/Info.plist > "$RUNNER_TEMP/OneDrop.plist"
              test "$(plutil -extract CFBundleIdentifier raw "$RUNNER_TEMP/OneDrop.plist")" = com.sycamore.onedrop
              test "$(plutil -extract CFBundleShortVersionString raw "$RUNNER_TEMP/OneDrop.plist")" = "$VERSION"
              test "${RELEASE_TAG#v}" = "$VERSION"
            fi
            cp "$IPA" "release-assets/OneDrop-${VERSION}.ipa"
          fi

      - name: Upload iOS package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

  livecontainer-source:
    name: Refresh release update feeds
    needs: [edge, android, ios]
    if: >-
      always() && !cancelled() &&
      (needs.edge.result == 'success' || needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
    steps:
      - name: Rebuild the Pages source and verify the published IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" | jq '{isDraft:.draft,isPrerelease:.prerelease,assets:[.assets[] | .url = .browser_download_url]}')
          if jq -e '.isDraft' <<< "$release" > /dev/null; then exit 0; fi
          if [[ "$RELEASE_TAG" == ios-beta-v* ]]; then
            jq -e '.isPrerelease' <<< "$release" > /dev/null
            version=${RELEASE_TAG#ios-beta-v}
            name="OneDrop-Beta-$version.ipa"
            bundle=com.sycamore.onedrop.beta
          else
            if jq -e '.isPrerelease' <<< "$release" > /dev/null; then exit 0; fi
            version=${RELEASE_TAG#v}
            name="OneDrop-$version.ipa"
            bundle=com.sycamore.onedrop
          fi
          asset=$(jq -c --arg name "$name" 'first(.assets[] | select(.name == $name and .state == "uploaded" and .size > 0)) // null' <<< "$release")
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          for attempt in {1..36}; do
            if ! curl --fail --silent --show-error --max-time 10 "https://onedrop.sycamore.top/updates.json?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt" |
              jq -e --arg v "$version" --argjson release "$release" '. as $feed | all($release.assets[] | select(.state == "uploaded" and (.name | test("(\\.ipa|-android\\.apk|-mobile-edge\\.crx)$"))); . as $asset | any($feed.assets[]; .version == $v and .url == $asset.url and .size == $asset.size and (.sha256 | test("^[a-f0-9]{64}$")) and .sha256 == ($asset.digest | sub("^sha256:"; ""))))' > /dev/null; then
              sleep 15
              continue
            fi
            if [[ "$asset" == null ]]; then exit 0; fi
            if curl --fail --silent --show-error --max-time 10 "https://onedrop.sycamore.top/apps.json?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt" |
              jq -e --arg bundle "$bundle" --arg v "$version" --argjson ipa "$asset" 'any(.apps[] | select(.bundleIdentifier == $bundle) | .versions[]; .version == $v and .size == $ipa.size and .downloadURL == $ipa.url)' > /dev/null; then
              exit 0
            fi
            sleep 15
          done
          echo "The published update feeds do not list all uploaded packages." >&2
          exit 1

  partner-center:
    name: Partner Center submission
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.partner_center_mode == 'validate' || inputs.partner_center_mode == 'publish') &&
      !startsWith(inputs.release_tag, 'ios-beta-v')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: release-source

      - name: Checkout current publishing automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: automation-source

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: release-source/package-lock.json

      - name: Install release dependencies
        working-directory: release-source
        run: npm ci

      - name: Build Partner Center ZIP
        working-directory: release-source
        run: |
          test -n "$WXT_ONEDROP_ENTRA_CLIENT_ID"
          npm run zip:store

      - name: Upload and submit Partner Center package
        env:
          EDGE_ADDONS_PRODUCT_ID: ${{ secrets.EDGE_ADDONS_PRODUCT_ID }}
          EDGE_ADDONS_API_KEY: ${{ secrets.EDGE_ADDONS_API_KEY }}
          EDGE_ADDONS_CLIENT_ID: ${{ secrets.EDGE_ADDONS_CLIENT_ID }}
          EDGE_ADDONS_CERTIFICATION_NOTES: ${{ secrets.EDGE_ADDONS_CERTIFICATION_NOTES }}
          EDGE_ADDONS_DRY_RUN: ${{ inputs.partner_center_mode == 'publish' && '0' || '1' }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid stable release tag" >&2; exit 1; }
          export EDGE_ADDONS_VERSION_NOTES_PATH="automation-source/.github/partner-center-notes/${RELEASE_TAG}.md"
          test -s "$EDGE_ADDONS_VERSION_NOTES_PATH" || { echo "Missing version-specific certification notes for $RELEASE_TAG" >&2; exit 1; }
          VERSION=$(node -p "require('./release-source/package.json').version")
          EDGE_ADDONS_PACKAGE_PATH="release-source/.output/OneDrop-${VERSION}-edge-store.zip" node automation-source/scripts/publish-edge-addons.mjs
