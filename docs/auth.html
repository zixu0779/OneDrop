<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/assets/onedrop-icon.png" />
    <title>Sign-in Complete · OneDrop</title>
    <style>
      :root {
        color: #172033;
        background: #f4f7fb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }

      main {
        width: min(100%, 400px);
        padding: 30px 26px;
        border: 1px solid rgb(117 133 155 / 18%);
        border-radius: 22px;
        text-align: center;
        background: rgb(255 255 255 / 86%);
        box-shadow: 0 18px 50px rgb(28 43 67 / 10%);
      }

      h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.2;
      }

      p {
        margin: 12px 0 0;
        color: #58677b;
        font-size: 15px;
        line-height: 1.5;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color: #f4f6fa;
          background: #111720;
        }

        main {
          border-color: rgb(255 255 255 / 10%);
          background: rgb(31 40 53 / 92%);
        }

        p {
          color: #aeb9c8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sign-in Complete</h1>
      <p>You can return to OneDrop.</p>
    </main>
  </body>
</html>
